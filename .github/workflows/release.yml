name: Release

on:
  push:
    branches:
      - main

# Pushes the built action to the `action` branch.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: oven-sh/setup-bun@v2.2.0

      - run: bun install --frozen-lockfile
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN_READ_ONLY }}
      - run: bun build:action

      - uses: ActionwareIO/branch-push-action@action
        with:
          branch: action
          files: |
            README.md
            action.yml
            package.json
            ./out/action.js
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}