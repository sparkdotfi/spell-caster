name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: ["20"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0

      # bun reads ~/.npmrc; the private @sparkdotfi packages need the read-only token.
      - name: Configure npm registry auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN_READ_ONLY}" > ~/.npmrc
        env:
          NPM_TOKEN_READ_ONLY: ${{ secrets.NPM_TOKEN_READ_ONLY }}
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun test
      - run: bun typecheck
      
      - run: bun build:action # dry run build
